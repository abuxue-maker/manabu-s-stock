<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>その場字幕</title><meta name="apple-mobile-web-app-title" content="その場字幕"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>[hidden]{display:none!important}html,body{margin:0}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one-screen caption stage. Guide sits at the top, captions stack up from the bottom, mic and composer are docked at the foot. */
:root{
  --bg:#F1F4F8;
  --surface:#FFFFFF;
  --ink:#0E1822;
  --ink-2:#47556A;
  --line:#D3DAE3;
  --accent:#1B4DDB;
  --accent-ink:#FFFFFF;
  --live:#C9341A;
  --live-ink:#FFFFFF;
  --live-ring:rgba(201,52,26,.4);
  --warn-bg:#FFF1E6;
  --warn-line:#EDB48E;
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F15;
    --surface:#141C25;
    --ink:#F2F5F9;
    --ink-2:#A3B0C0;
    --line:#263341;
    --accent:#8CAEFF;
    --accent-ink:#0A0F15;
    --live:#FF7D60;
    --live-ink:#1A0B07;
    --live-ring:rgba(255,125,96,.4);
    --warn-bg:#2B1A12;
    --warn-line:#7B4A31;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F15;
  --surface:#141C25;
  --ink:#F2F5F9;
  --ink-2:#A3B0C0;
  --line:#263341;
  --accent:#8CAEFF;
  --accent-ink:#0A0F15;
  --live:#FF7D60;
  --live-ink:#1A0B07;
  --live-ring:rgba(255,125,96,.4);
  --warn-bg:#2B1A12;
  --warn-line:#7B4A31;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{box-sizing:border-box;height:100%}
body{
  height:100%;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.5;
  overflow:hidden;
}
button,textarea{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{
  --cap:38px;
  height:100%;
  min-height:0;
  max-width:760px;
  margin-inline:auto;
  display:flex;
  flex-direction:column;
}
.app[data-size="1"]{--cap:28px}
.app[data-size="2"]{--cap:38px}
.app[data-size="3"]{--cap:50px}
.app[data-size="4"]{--cap:64px}

/* header */
.top{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-block:10px;
}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.06em}
.top-right{display:flex;align-items:center;gap:8px;min-width:0}
.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:44px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink-2);
  font-size:14px;
  white-space:nowrap;
}
.status[data-state="on"]{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink-2);flex:none}
.status[data-state="on"] .dot{background:var(--live);animation:blink 1.4s ease-in-out infinite}
.btn-quiet{
  min-height:44px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
  color:var(--ink);
  font-size:15px;
}

/* caption stage */
.stage{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  border-top:1px solid var(--line);
  scrollbar-width:thin;
}
.stage-inner{
  min-height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding-block:12px 8px;
}
.guide{margin-bottom:auto;padding-block:8px 24px}
.guide h2{margin:0 0 6px;font-size:21px;line-height:1.4;text-wrap:balance}
.guide p{margin:0;color:var(--ink-2)}
.how{list-style:none;margin:16px 0;padding:0;display:grid;gap:12px}
.how li{display:flex;gap:12px;align-items:flex-start}
.how svg{flex:none;width:24px;height:24px;margin-top:1px;color:var(--accent)}
.how b{font-weight:700}

.line{
  padding-block:14px;
  border-bottom:1px solid var(--line);
  transition:opacity .5s linear;
}
.line.leaving{opacity:0!important}
.line-text{
  margin:0;
  font-size:calc(var(--cap) * .66);
  line-height:1.45;
  font-weight:400;
  color:var(--ink-2);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:auto-phrase;
  line-break:strict;
}
.line.latest .line-text{
  font-size:var(--cap);
  line-height:1.38;
  font-weight:700;
  color:var(--ink);
}
.line-meta{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
  font-size:12px;
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.tag{
  padding:0 8px;
  border:1px solid var(--accent);
  border-radius:999px;
  color:var(--accent);
  font-weight:700;
}
.track{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar{height:100%;background:var(--accent);transform-origin:left center;transition:transform .5s linear}
.app[data-vanish="0"] .track{visibility:hidden}

.live{
  padding-block:14px;
  font-size:var(--cap);
  line-height:1.38;
  font-weight:700;
  color:var(--ink);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:auto-phrase;
  line-break:strict;
  text-decoration:underline dotted var(--live) 3px;
  text-underline-offset:.22em;
}

/* notice */
.notice{
  flex:none;
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-bottom:8px;
  padding:12px 14px;
  border:1px solid var(--warn-line);
  border-radius:12px;
  background:var(--warn-bg);
  font-size:15px;
}
.notice span{flex:1;min-width:0}
.notice button{
  flex:none;
  min-height:36px;
  padding:0 12px;
  border:1px solid var(--warn-line);
  border-radius:10px;
  background:transparent;
  color:var(--ink);
  font-size:14px;
}

/* settings */
.settings{
  flex:none;
  display:grid;
  gap:16px;
  margin-bottom:8px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--surface);
}
.set-row{display:grid;gap:8px;min-width:0}
.set-label{font-size:14px;font-weight:700;color:var(--ink-2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{
  flex:1 1 0;
  min-width:64px;
  min-height:44px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
}
.seg button[aria-pressed="true"]{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--accent-ink);
  font-weight:700;
}
.btn-clear{
  min-height:44px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
}

/* dock */
.dock{
  flex:none;
  display:grid;
  gap:10px;
  padding-block:10px 12px;
  border-top:1px solid var(--line);
}
.dock-row{display:flex;gap:10px}
.mic{
  flex:1;
  min-width:0;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:0 18px;
  border:0;
  border-radius:20px;
  background:var(--accent);
  color:var(--accent-ink);
  font-size:20px;
  font-weight:700;
}
.mic svg{width:30px;height:30px;flex:none}
.mic.on{
  background:var(--live);
  color:var(--live-ink);
  animation:ring 1.6s ease-out infinite;
}
.kbd{
  flex:none;
  min-height:72px;
  padding:0 16px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--surface);
  color:var(--ink);
  font-size:15px;
}
.composer{display:flex;align-items:flex-end;gap:10px}
#msg{
  flex:1;
  min-width:0;
  min-height:60px;
  max-height:140px;
  padding:16px 14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--surface);
  color:var(--ink);
  font-size:18px;
  line-height:1.4;
  resize:none;
}
#msg::placeholder{color:var(--ink-2)}
.send{
  flex:none;
  min-height:60px;
  padding:0 18px;
  border:0;
  border-radius:16px;
  background:var(--accent);
  color:var(--accent-ink);
  font-size:17px;
  font-weight:700;
}

.status{min-width:44px;justify-content:center}
#statusText{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:480px){
  #statusText{position:static;width:auto;height:auto;overflow:visible;clip:auto}
}
.ver{margin:0;font-size:12px;color:var(--ink-2)}
@keyframes blink{50%{opacity:.35}}
@keyframes ring{
  0%{box-shadow:0 0 0 0 var(--live-ring)}
  70%{box-shadow:0 0 0 14px rgba(0,0,0,0)}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="app" id="app" data-size="2" data-vanish="60000">
  <header class="top">
    <h1>その場字幕</h1>
    <div class="top-right">
      <span class="status" id="status" data-state="off"><i class="dot" aria-hidden="true"></i><span id="statusText">音声オフ</span></span>
      <button class="btn-quiet" id="resetBtn" type="button">リセット</button>
      <button class="btn-quiet" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settings">設定</button>
    </div>
  </header>

  <main class="stage" id="stage" aria-label="会話の文字表示">
    <div class="stage-inner">
      <section class="guide" id="guide">
        <h2>会話を、大きな文字で表示します</h2>
        <p>耳が聞こえにくい方と話すときに使います。</p>
        <ul class="how">
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
            <span><b>声を文字にする</b> 下の「話を文字にする」を押して、ゆっくり話してもらいます。</span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            <span><b>文字で伝える</b> 「文字で入力」を押して、入力して送信します。</span>
          </li>
        </ul>
        <p>表示は設定した時間がたつと消え、どこにも保存されません。</p>
      </section>
      <div id="lines" role="log" aria-live="polite"></div>
      <div class="live" id="live" aria-hidden="true" hidden></div>
    </div>
  </main>

  <div class="notice" id="notice" role="status" hidden>
    <span id="noticeText"></span>
    <button type="button" id="noticeClose">閉じる</button>
  </div>

  <section class="settings" id="settings" aria-label="表示の設定" hidden>
    <div class="set-row">
      <span class="set-label">文字の大きさ</span>
      <div class="seg" id="sizeSeg"></div>
    </div>
    <div class="set-row">
      <span class="set-label">消えるまでの時間</span>
      <div class="seg" id="vanishSeg"></div>
    </div>
    <button type="button" class="btn-clear" id="clearBtn">いまの表示をすべて消す</button>
    <p class="ver">バージョン 4（止めても続けて聞き取れるように修正）</p>
  </section>

  <div class="dock">
    <div class="dock-row">
      <button class="mic" id="micBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        <span id="micLabel">話を文字にする</span>
      </button>
      <button class="kbd" id="kbdBtn" type="button" aria-expanded="false" aria-controls="composer">文字で入力</button>
    </div>
    <form class="composer" id="composer" autocomplete="off" hidden>
      <textarea id="msg" rows="1" enterkeyhint="send" aria-label="伝えたい内容" placeholder="話し相手の方は、ここに入力"></textarea>
      <button class="send" type="submit">送信</button>
    </form>
  </div>
</div>

<script>
(() => {
  'use strict';
  document.documentElement.lang = 'ja';
  const $ = (id) => document.getElementById(id);
  const app = $('app'), stage = $('stage'), linesEl = $('lines'), liveEl = $('live'),
        guide = $('guide'), notice = $('notice'), noticeText = $('noticeText'),
        statusEl = $('status'), statusText = $('statusText'), micBtn = $('micBtn'),
        form = $('composer'), input = $('msg'), settingsBtn = $('settingsBtn'), micLabel = $('micLabel'), kbdBtn = $('kbdBtn'), resetBtn = $('resetBtn'),
        settingsEl = $('settings');

  /* ---------- settings (per-viewer convenience only; captions are never stored) ---------- */
  const KEY = 'sonoba-jimaku-settings';
  const SIZES = [[1, '標準'], [2, '大'], [3, '特大'], [4, '最大']];
  const VANISH = [[30000, '30秒'], [60000, '1分'], [300000, '5分'], [0, '消さない']];
  const settings = { size: 2, vanish: 60000 };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s) {
      if (SIZES.some((x) => x[0] === s.size)) settings.size = s.size;
      if (VANISH.some((x) => x[0] === s.vanish)) settings.vanish = s.vanish;
    }
  } catch (e) { /* storage unavailable */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} };

  /* ---------- captions ---------- */
  const SAMPLE_LIFE = 30000;
  const MAX_LINES = 1000;
  const timeFmt = new Intl.DateTimeFormat('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
  const lines = [];
  let seq = 0;
  let liveText = '';

  const lifeOf = (r) => (r.sample ? SAMPLE_LIFE : settings.vanish);
  const scrollDown = () => requestAnimationFrame(() => { stage.scrollTop = stage.scrollHeight; });

  function updateGuide() {
    guide.hidden = !!liveText || lines.some((r) => !r.sample);
  }

  function markLatest() {
    const els = [...linesEl.children].filter((e) => !e.classList.contains('leaving'));
    els.forEach((e) => e.classList.remove('latest'));
    if (!liveText && els.length) els[els.length - 1].classList.add('latest');
  }

  function removeLine(r, instant) {
    const i = lines.indexOf(r);
    if (i >= 0) lines.splice(i, 1);
    if (instant) {
      r.el.remove();
    } else {
      r.el.classList.add('leaving');
      setTimeout(() => r.el.remove(), 500);
    }
    updateGuide();
    markLatest();
  }

  function addLine(raw, opts) {
    const sample = !!(opts && opts.sample);
    const text = String(raw).trim();
    if (!text) return;
    if (!sample) lines.filter((r) => r.sample).forEach((r) => removeLine(r, true));

    const el = document.createElement('article');
    el.className = 'line';
    const p = document.createElement('p');
    p.className = 'line-text';
    p.textContent = text;
    const meta = document.createElement('div');
    meta.className = 'line-meta';
    const t = document.createElement('time');
    t.textContent = timeFmt.format(new Date());
    meta.appendChild(t);
    if (sample) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '見本';
      meta.appendChild(tag);
    }
    const track = document.createElement('div');
    track.className = 'track';
    const bar = document.createElement('div');
    bar.className = 'bar';
    track.appendChild(bar);
    meta.appendChild(track);
    el.append(p, meta);

    const rec = { id: ++seq, born: Date.now(), sample, el, bar };
    lines.push(rec);
    linesEl.appendChild(el);
    while (lines.length > MAX_LINES) removeLine(lines[0], true);

    updateGuide();
    markLatest();
    scrollDown();
    tick();
  }

  function tick() {
    const now = Date.now();
    lines.slice().forEach((r) => {
      const life = lifeOf(r);
      if (!life) {
        if (!r.fixed) {
          r.bar.style.transform = 'scaleX(1)';
          r.el.style.opacity = '';
          r.fixed = true;
        }
        return;
      }
      r.fixed = false;
      const remain = r.born + life - now;
      if (remain <= 0) { removeLine(r, false); return; }
      r.bar.style.transform = 'scaleX(' + (remain / life).toFixed(3) + ')';
      const fadeSpan = Math.min(8000, life * 0.3);
      const k = Math.min(1, remain / fadeSpan);
      r.el.style.opacity = (0.35 + 0.65 * k).toFixed(2);
    });
  }

  function setLive(text) {
    liveText = String(text || '').trim();
    liveEl.textContent = liveText;
    liveEl.hidden = !liveText;
    updateGuide();
    markLatest();
    if (liveText) scrollDown();
  }

  /* ---------- notice ---------- */
  let noticeTimer = null;
  function showNotice(msg, autoHideMs) {
    clearTimeout(noticeTimer);
    noticeText.textContent = msg;
    notice.hidden = false;
    if (autoHideMs) noticeTimer = setTimeout(() => { notice.hidden = true; }, autoHideMs);
  }
  function hideNotice() { clearTimeout(noticeTimer); notice.hidden = true; }
  $('noticeClose').addEventListener('click', hideNotice);

  /* ---------- settings UI ---------- */
  const syncers = [];
  function buildSeg(host, opts, key) {
    const btns = opts.map(([val, label]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.addEventListener('click', () => { settings[key] = val; save(); applySettings(); scrollDown(); });
      host.appendChild(b);
      return b;
    });
    syncers.push(() => btns.forEach((b, i) => b.setAttribute('aria-pressed', String(opts[i][0] === settings[key]))));
  }
  function applySettings() {
    app.dataset.size = String(settings.size);
    app.dataset.vanish = String(settings.vanish);
    syncers.forEach((f) => f());
    tick();
  }
  buildSeg($('sizeSeg'), SIZES, 'size');
  buildSeg($('vanishSeg'), VANISH, 'vanish');

  settingsBtn.addEventListener('click', () => {
    const open = settingsEl.hidden;
    settingsEl.hidden = !open;
    settingsBtn.setAttribute('aria-expanded', String(open));
    settingsBtn.textContent = open ? '閉じる' : '設定';
  });
  $('clearBtn').addEventListener('click', () => { lines.slice().forEach((r) => removeLine(r, true)); });

  /* ---------- typed input ---------- */
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  kbdBtn.addEventListener('click', () => {
    const open = form.hidden;
    form.hidden = !open;
    kbdBtn.setAttribute('aria-expanded', String(open));
    kbdBtn.textContent = open ? '文字入力を閉じる' : '文字で入力';
    if (open) { input.focus(); autoGrow(); }
    scrollDown();
  });
  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { cancelable: true }));
    }
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t) return;
    addLine(t);
    input.value = '';
    autoGrow();
    input.focus();
  });

  /* ---------- voice input ---------- */
  /* One recognizer at a time. A new one starts only after the previous one has ended,
     and events from an old recognizer are ignored, so stopping and starting again
     (or the engine closing by itself) can never leave two of them fighting. */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const STATUS_TEXT = { off: '音声オフ', on: '聞き取り中', blocked: '音声は使えません' };
  let rec = null;            // the only recognizer allowed to talk to the page
  let phase = 'idle';        // idle | starting | listening | stopping
  let wantMic = false;       // the person wants listening to continue
  let pendingStart = false;  // start pressed while the previous session was still closing
  let restarts = [];
  let hadStarted = false;
  let lastResult = Date.now();
  let lastEnd = 0;
  let hinted = false;
  let stoppedByHide = false;
  let resumeTry = false;
  let stopTimer = null;

  function setStatus(state) {
    statusEl.dataset.state = state;
    statusText.textContent = STATUS_TEXT[state];
    const on = state === 'on';
    micBtn.classList.toggle('on', on);
    micBtn.setAttribute('aria-pressed', String(on));
    micLabel.textContent = on ? '聞き取りを止める' : '話を文字にする';
  }

  function detach(r) {
    if (!r) return;
    r.onresult = r.onerror = r.onend = r.onstart = null;
  }

  /* the current recognizer is finished (ended, or cut off) */
  function finishSession() {
    clearTimeout(stopTimer);
    const r = rec;
    rec = null;
    detach(r);
    phase = 'idle';
    lastEnd = Date.now();
    setLive('');
  }

  /* after an error some iPhones never send "end": cut the session off ourselves */
  function closeSoon() {
    const r = rec;
    clearTimeout(stopTimer);
    stopTimer = setTimeout(() => {
      if (r && rec === r) {
        finishSession();
        try { r.abort(); } catch (e) {}
      }
    }, 1500);
  }

  function scheduleBegin(ms) {
    setTimeout(() => { if (wantMic && phase === 'idle') beginRec(); }, ms);
  }

  /* start was pressed while the last session was closing: begin now that it is closed */
  function afterIdle() {
    if (!pendingStart) return false;
    pendingStart = false;
    wantMic = true;
    restarts = [];
    scheduleBegin(500);
    return true;
  }

  function onSessionEnd() {
    finishSession();
    if (afterIdle()) return;
    if (wantMic) {
      /* the engine closed on its own (silence, time limit): keep going */
      const now = Date.now();
      restarts = restarts.filter((t) => now - t < 10000);
      restarts.push(now);
      if (restarts.length > 6) {
        wantMic = false;
        setStatus('off');
        showNotice('聞き取りが続けて止まりました。マイクをもう一度押してください。');
        return;
      }
      scheduleBegin(250);
      return;
    }
    if (statusEl.dataset.state === 'on') setStatus('off');
  }

  function handleError(code) {
    if (resumeTry && !hadStarted && code !== 'no-speech') {
      resumeTry = false;
      wantMic = false;
      pendingStart = false;
      setStatus('off');
      showNotice('リセットしました。マイクを押すと、聞き取りを始めます。', 6000);
      closeSoon();
      return;
    }
    if (code === 'not-allowed' || code === 'service-not-allowed') {
      wantMic = false;
      pendingStart = false;
      if (hadStarted) {
        setStatus('off');
        showNotice('聞き取りが止まりました。マイクをもう一度押してください。');
      } else if (code === 'service-not-allowed') {
        setStatus('blocked');
        showNotice('音声認識を使えません。iPhoneの「設定」で、音声入力（一般 > キーボード）とSiriがオンか確認してください。');
      } else {
        setStatus('blocked');
        showNotice('マイクが許可されていません。アドレスバー左の「ぁあ」から「Webサイトの設定」を開き、マイクを許可してください。');
      }
      closeSoon();
    } else if (code === 'audio-capture') {
      wantMic = false;
      pendingStart = false;
      setStatus('blocked');
      showNotice('マイクが見つかりません。「文字で入力」から文字を打ってください。');
      closeSoon();
    } else if (code === 'network') {
      wantMic = false;
      pendingStart = false;
      setStatus('off');
      showNotice('音声の認識に必要な通信ができませんでした。通信できる場所でもう一度マイクを押してください。');
      closeSoon();
    }
  }

  function beginRec() {
    const r = new SR();
    rec = r;
    r.lang = 'ja-JP';
    r.continuous = true;
    r.interimResults = true;
    r.onstart = () => {
      if (r !== rec) return;
      phase = 'listening';
      hadStarted = true;
      resumeTry = false;
    };
    r.onresult = (e) => {
      if (r !== rec) return;
      lastResult = Date.now();
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) addLine(res[0].transcript);
        else interim += res[0].transcript;
      }
      setLive(interim);
    };
    r.onerror = (e) => { if (r === rec) handleError(e.error); };
    r.onend = () => { if (r === rec) onSessionEnd(); };
    phase = 'starting';
    try {
      r.start();
    } catch (err) {
      finishSession();
      wantMic = false;
      setStatus('off');
      showNotice('聞き取りを始められませんでした。もう一度マイクを押してください。');
    }
  }

  function startMic(fromReset) {
    if (!SR) {
      setStatus('blocked');
      showNotice('このブラウザは音声入力に対応していません。iPhoneのSafariで開き直すか、「文字で入力」から文字を打ってください。');
      return;
    }
    hideNotice();
    wantMic = true;
    restarts = [];
    hadStarted = false;
    lastResult = Date.now();
    hinted = false;
    resumeTry = !!fromReset;
    setStatus('on');
    if (phase !== 'idle') { pendingStart = true; return; }
    const wait = Math.max(0, 500 - (Date.now() - lastEnd));
    if (wait) scheduleBegin(wait); else beginRec();
  }

  function stopMic() {
    wantMic = false;
    pendingStart = false;
    setStatus('off');
    if (phase === 'listening' || phase === 'starting') {
      phase = 'stopping';
      const r = rec;
      try { r.stop(); } catch (e) {}
      clearTimeout(stopTimer);
      stopTimer = setTimeout(() => {
        if (r && rec === r) {
          finishSession();
          try { r.abort(); } catch (e) {}
          afterIdle();
        }
      }, 2500);
    }
  }
  micBtn.addEventListener('click', () => { if (wantMic) stopMic(); else startMic(); });

  /* drop the current recognizer at once, without letting it restart */
  function killRec() {
    clearTimeout(stopTimer);
    const r = rec;
    rec = null;
    detach(r);
    phase = 'idle';
    lastEnd = Date.now();
    if (r) { try { r.abort(); } catch (e) {} }
  }

  /* reset: back to the first-launch state (display size and vanish time are kept) */
  function resetAll() {
    const resume = wantMic;
    wantMic = false;
    pendingStart = false;
    killRec();
    restarts = [];
    hadStarted = false;
    hinted = false;
    stoppedByHide = false;
    lines.slice().forEach((r) => removeLine(r, true));
    setLive('');
    input.value = '';
    autoGrow();
    form.hidden = true;
    kbdBtn.setAttribute('aria-expanded', 'false');
    kbdBtn.textContent = '文字で入力';
    settingsEl.hidden = true;
    settingsBtn.setAttribute('aria-expanded', 'false');
    settingsBtn.textContent = '設定';
    setStatus('off');
    try { if (wake) wake.release(); } catch (e) {}
    wake = null;
    keepAwake();
    stage.scrollTop = 0;
    if (resume) {
      startMic(true);
      showNotice('リセットして、聞き取りをやり直しています。', 4000);
    } else {
      showNotice('リセットしました。マイクを押すと、聞き取りを始めます。', 6000);
    }
  }
  resetBtn.addEventListener('click', resetAll);

  /* iPhone stops listening when the screen is left, so say so instead of looking stuck */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (wantMic) {
        wantMic = false;
        pendingStart = false;
        killRec();
        setLive('');
        setStatus('off');
        stoppedByHide = true;
      }
    } else if (stoppedByHide) {
      stoppedByHide = false;
      showNotice('画面を離れたため、聞き取りを止めました。マイクをもう一度押してください。');
    }
  });

  /* long silence: point at the reset button once */
  setInterval(() => {
    if (wantMic && !hinted && Date.now() - lastResult > 60000) {
      hinted = true;
      showNotice('しばらく反応がありません。聞き取れないときは、右上の「リセット」を押してください。', 12000);
    }
  }, 5000);

  /* ---------- keep the screen on while talking ---------- */
  let wake = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { wake = null; }
  }
  document.addEventListener('visibilitychange', keepAwake);
  window.addEventListener('pointerdown', keepAwake, { once: true });

  /* ---------- start ---------- */
  applySettings();
  addLine('こんにちは。ゆっくり話しますね。聞こえにくいときは、遠慮なく言ってください。', { sample: true });
  setInterval(tick, 500);
  keepAwake();
  if (!SR) setStatus('blocked');
})();
</script>
